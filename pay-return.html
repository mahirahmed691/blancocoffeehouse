<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blanco.</title>
    <meta name="theme-color" content="#E9E1D8" />
    <meta name="robots" content="noindex" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e9e1d8;
        color: #503931;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }
      p {
        margin: 0 0 0.75rem;
        max-width: 22rem;
      }
      .word {
        font-style: italic;
        font-size: 1.6rem;
      }
      a {
        color: #503931;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="word">blanco.</p>
      <p id="line">Back to the app.</p>
      <p><a id="go" href="blanco://pay">Open blanco.</a></p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var to = String(params.get("to") || "blanco://pay");
        var safe =
          /^(blanco|exp):\/\//i.test(to) && to.length < 300
            ? to.split("#")[0]
            : "blanco://pay";
        var q = params.get("paid") === "1" ? "paid=1" : params.get("cancel") === "1" ? "cancel=1" : "";
        var href = q ? safe + (safe.indexOf("?") >= 0 ? "&" : "?") + q : safe;
        var line = document.getElementById("line");
        var go = document.getElementById("go");
        if (params.get("paid") === "1") line.textContent = "Paid. The house has it.";
        else if (params.get("cancel") === "1") line.textContent = "The card was let go.";
        if (go) go.setAttribute("href", href);
        window.location.replace(href);
      })();
    </script>
  </body>
</html>
